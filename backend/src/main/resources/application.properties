spring.application.name=tunisia-invest
server.port=${SERVER_PORT:8080}

# ── Base de données PostgreSQL (Neon en production, local en développement) ──
# La chaîne Neon `postgresql://user:pass@host/db?sslmode=require` se traduit en
# trois variables : DB_URL=jdbc:postgresql://host/db?sslmode=require, DB_USER,
# DB_PASSWORD. Aucun identifiant n'est écrit dans ce fichier.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tunisia_invest}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Le modèle de données appartient à sql/schema.sql, source unique de vérité.
# Hibernate ne crée ni ne modifie jamais une table : une divergence doit se
# corriger par une migration versionnée, pas par un effet de bord au démarrage.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Sécurité ──
app.jwt.secret=${JWT_SECRET:changez_moi_par_une_chaine_aleatoire_d_au_moins_32_caracteres}
app.jwt.expiration-hours=${JWT_EXPIRES_HOURS:24}

# ── Affichage ──
# Devise du catalogue et de la comptabilité.
app.devise=${DEVISE:TND}

# ── Paiement ──
# simulation : la commande est validée dans la plateforme, aucun débit.
# paypal     : transaction réelle via l'API Orders v2.
app.paypal.mode=${PAIEMENT_MODE:simulation}
app.paypal.env=${PAYPAL_ENV:sandbox}
app.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
# Le dinar tunisien n'est pas une devise acceptée par PayPal : le catalogue
# reste en TND, la transaction est présentée dans la devise ci-dessous.
app.paypal.currency=${PAYPAL_CURRENCY:EUR}
app.paypal.taux-tnd=${PAYPAL_TAUX_TND:0.29}
app.paypal.locale=${PAYPAL_LOCALE:fr_FR}
app.paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# ── Moteur de rapports (service Node interne) ──
app.report-engine.base-url=${REPORT_ENGINE_URL:http://localhost:3001}
app.report-engine.token=${REPORT_ENGINE_TOKEN:dev-internal-token}
app.report-engine.timeout-seconds=${REPORT_ENGINE_TIMEOUT:180}

# ── CORS ──
app.cors.origins=${CORS_ORIGIN:http://localhost:5173}

# ── Documentation ──
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
